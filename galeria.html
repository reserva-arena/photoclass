<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoClass - Galeria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260728c">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header class="app-header">
    <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Abrir menu">☰</button>
    <div class="app-header-brand">
      <img src="img/arena-logo.png" alt="Colégio Arena" class="brand-logo">
      <div class="app-header-titles">
        <span class="app-header-title">PhotoClass</span>
        <span class="app-header-subtitle">Colégio Arena</span>
      </div>
    </div>
    <nav class="app-header-nav">
      <a href="dashboard.html">Painel</a>
      <a href="alunos.html">Alunos</a>
      <a href="fotos.html">Fotos</a>
      <a href="revisao.html">Revisão</a>
      <a href="galeria.html" class="active">Galeria</a>
      <a href="professores.html" id="nav-professores" hidden>Professoras</a>
    </nav>
    <div class="app-header-actions">
      <button id="view-toggle" class="btn-ghost" hidden></button>
      <span id="user-email" class="app-header-email"></span>
      <button id="logout-button" class="btn-ghost">Sair</button>
    </div>
  </header>

  <main class="app-main">

    <section class="card">
      <h2>Galeria</h2>
      <p class="card-subtitle" id="galeria-subtitle">Veja as fotos organizadas por turma, aluno e atividade</p>

      <nav id="galeria-breadcrumb" class="galeria-breadcrumb" hidden></nav>
      <div id="galeria-compartilhar" class="galeria-compartilhar" hidden></div>

      <div class="field" id="galeria-turma-field">
        <label for="galeria-turma-select">Turma</label>
        <select id="galeria-turma-select">
          <option value="">Selecione uma turma</option>
        </select>
      </div>

      <p id="galeria-vazio" class="empty-state" hidden></p>
      <div id="galeria-grid" class="galeria-grid"></div>
    </section>

  </main>

  <script type="module" src="js/galeria.js?v=20260728c"></script>
  <footer class="app-footer">
    <strong>PhotoClass</strong> · Dev: Luciano Galdino · Frontend: HTML, CSS, JS · Hospedagem: GitHub Pages · Backend: Firebase + Google Drive
  </footer>
</body>
</html>
