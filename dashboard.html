<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoClass - Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header-brand">
      <span class="brand-mark">PC</span>
      <span class="app-header-title">PhotoClass</span>
    </div>
    <nav class="app-header-nav">
      <a href="dashboard.html" class="active">Painel</a>
      <a href="alunos.html">Alunos</a>
      <a href="fotos.html">Fotos</a>
      <a href="revisao.html">Revisão</a>
      <a href="professores.html" id="nav-professores" hidden>Professoras</a>
    </nav>
    <div class="app-header-actions">
      <button id="view-toggle" class="btn-ghost" hidden></button>
      <span id="user-email" class="app-header-email"></span>
      <button id="logout-button" class="btn-ghost">Sair</button>
    </div>
  </header>

  <main class="app-main">
    <section class="card">
      <h2>Bem-vindo(a)!</h2>
      <p class="card-subtitle">Educação Infantil</p>
      <a href="alunos.html" class="btn-primary" style="display:block; text-align:center; text-decoration:none; line-height:48px; margin-bottom: 10px;">
        Cadastrar / ver alunos
      </a>
      <a href="fotos.html" class="btn-ghost" style="display:block; text-align:center; text-decoration:none; line-height:44px; height:44px;">
        Enviar fotos
      </a>
    </section>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
