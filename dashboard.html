<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoClass - Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="login-screen">
    <div class="login-card" style="max-width: 480px;">
      <div class="brand">
        <span class="brand-mark">PC</span>
        <div>
          <h1>PhotoClass</h1>
          <p class="brand-tagline" id="user-email">Carregando...</p>
        </div>
      </div>

      <p style="color: var(--color-navy-light); font-size: 14px; margin-bottom: 1.5rem;">
        Login funcionando! O painel de verdade (cadastro de alunos, upload de fotos) será construído na próxima etapa.
      </p>

      <button id="logout-button" class="btn-primary" style="background: var(--color-navy-light);">
        Sair
      </button>
    </div>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
