<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoClass - Professoras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <div class="app-header-brand">
      <span class="brand-mark">PC</span>
      <span class="app-header-title">PhotoClass</span>
    </div>
    <nav class="app-header-nav">
      <a href="dashboard.html">Painel</a>
      <a href="alunos.html">Alunos</a>
      <a href="fotos.html">Fotos</a>
      <a href="revisao.html">Revisão</a>
      <a href="professores.html" id="nav-professores" class="active" hidden>Professoras</a>
    </nav>
    <div class="app-header-actions">
      <button id="view-toggle" class="btn-ghost" hidden></button>
      <span id="user-email" class="app-header-email"></span>
      <button id="logout-button" class="btn-ghost">Sair</button>
    </div>
  </header>

  <main class="app-main">

    <section class="card">
      <h2 id="form-title">Liberar turma(s) para uma professora</h2>
      <p class="card-subtitle">O login dela precisa já existir no Firebase Authentication</p>

      <form id="professor-form" novalidate>
        <div class="field">
          <label for="email-input">E-mail da professora</label>
          <input type="email" id="email-input" required placeholder="fulana@colegioarena.com.br">
        </div>

        <div class="field">
          <label>Turmas que ela pode acessar</label>
          <div id="turmas-checklist" class="turmas-checklist"></div>
        </div>

        <p id="form-error" class="error-message" role="alert" hidden></p>
        <p id="form-success" class="success-message" role="status" hidden></p>

        <div style="display: flex; gap: 10px;">
          <button type="submit" id="submit-button" class="btn-primary">
            <span id="submit-button-text">Salvar</span>
          </button>
          <button type="button" id="cancel-edit-button" class="btn-ghost" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Professoras cadastradas</h2>
      <p class="card-subtitle" id="professores-count">Carregando...</p>

      <div id="professores-list" class="results-list"></div>
    </section>

  </main>

  <script type="module" src="js/professores.js"></script>
</body>
</html>
