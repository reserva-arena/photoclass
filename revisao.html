  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260804e">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header class="app-header">
    <button id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Abrir menu">☰</button>
    <div class="app-header-brand">
      <img src="img/arena-logo.png" alt="Colégio Arena" class="brand-logo">
      <div class="app-header-titles">
        <span class="app-header-title">PhotoClass</span>
        <span class="app-header-subtitle">Colégio Arena</span>
      </div>
    </div>
    <nav class="app-header-nav">
      <a href="dashboard.html">Painel</a>
      <a href="alunos.html">Alunos</a>
      <a href="fotos.html">Fotos</a>
      <a href="revisao.html" class="active">Revisão</a>
      <a href="galeria.html">Galeria</a>
      <a href="professores.html" id="nav-professores" hidden>Professoras</a>
    </nav>
    <div class="app-header-actions">
      <button id="view-toggle" class="btn-ghost" hidden></button>
      <span id="user-email" class="app-header-email"></span>
      <button id="logout-button" class="btn-ghost">Sair</button>
    </div>
  </header>

  <main class="app-main">

    <section class="card">
      <h2>Fotos aguardando identificação</h2>
      <p class="card-subtitle" id="revisao-subtitle">Carregando...</p>

      <div class="field">
        <label for="turma-filtro">Filtrar por turma</label>
        <select id="turma-filtro">
          <option value="">Todas as turmas</option>
        </select>
      </div>

      <button id="descartar-todas-button" class="btn-ghost" hidden style="margin-bottom: 12px;">Descartar todas as fotos desta lista</button>

      <div id="revisao-list" class="results-list"></div>
    </section>

  </main>

  <script type="module" src="js/revisao.js?v=20260804e"></script>
  <footer class="app-footer">
    <a href="guia.html" style="color: #fff; text-decoration: underline;">📖 Guia de uso</a> · <strong>PhotoClass</strong> · Dev: Luciano Galdino · Frontend: HTML, CSS, JS · Hospedagem: GitHub Pages · Backend: Firebase + Google Drive
  </footer>
